[package]
name = "nevis"
version = "0.1.0"
edition = "2024"
description = "A fast, minimal text and Markdown editor (GTK4 + GtkSourceView)"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
sourceview = { package = "sourceview5", version = "0.11" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
